id: blue-archive
name: 블루 아카이브
version: 0.1.0
summary: '학원도시 키보토스. 구현 범위: 아비도스 자치구, 밀레니엄 사이언스 스쿨, 게헨나 학원, 트리니티 종합학원, 백귀야행 연합학원, 산해경 고급중학교, 붉은겨울 연방학원, 발키리 경찰학교, SRT 특수학원,
  아리우스 분교, 하이랜더 철도학원, 와일드헌트 예술학원, 오디세이아 해양학교.'
