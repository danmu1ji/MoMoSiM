  nameEn: Saya
  summaryEn: A genius inventor from Shanhaijng. Having already acquired 6 degrees by the time she was in Elementary school,
    the nicknamed genius is known for bullying and causing trouble for a lot of people. Saya brings along with her a rat assistant
    that she's been with since childhood, they're so close that she considers it to be like family.
