  nameEn: Suzumi
  summaryEn: A member of Trinity Integrated Academy's Vigilante Corps. Because of Trinity students frequently being targeted
    by other schools, the Vigilante Corps began patrolling around town to defend against this. Due to her flaring sense of
    justice, Suzumi is often misunderstood to have a cold personality. In reality she really is a gentle girl.
- id: character:tsurugi
  type: character
