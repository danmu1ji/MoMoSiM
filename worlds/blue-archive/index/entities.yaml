  nameEn: Kirino
  summaryEn: An enthusiastic student belonging to the Community Safety Bureau of Valkyrie Police Academy. Looking up to the
    police officers who maintain law and order in the city, Kirino enrolled in the Valkyrie Police Academy, but was placed
    in the Community Safety Bureau due to her fatally poor shooting skills. Nevertheless, she doesn't give up on her dream,
    and strives everyday to become a police officer who can skilfully suppress criminals.
