  nameEn: Nodoka
  summaryEn: Nodoka is a student of Red Winter. However, she is currently suspended from school, instead being confined to
    Class No. 227 in the old school building. The reason for her suspension is "using a telescope to engage in stalking".
    Nodoka has a desire to observe all of the beautiful things in the world with her own eyes (including Sensei). The long
    hardship she has endured as part of Class No. 227 has given her a deep-running sense of frugality.
