  nameEn: Nagisa
  summaryEn: Affiliated with Trinity General Academy, she is the leader of "Filius", one of the student union bodies that
    make up Trinity, and the host of the "Tea Party" student council. Nagisa is refined and soft-spoken, but rarely reveals
    her true feelings, making her a complicated and mysterious character. Her hobby is preparing tea leaves and sweets for
    tea parties. She dreams of a day when many Trinity students would be invited to a tea party of hers.
