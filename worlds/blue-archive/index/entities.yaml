  nameEn: Kokoro
  summaryEn: A student of Odyssey Maritime School and captain of the Diving Club. True to her title, Kokoro is highly skilled
    at diving. Whenever trouble arises underwater, such as recovering dropped items or repairing cables, the students of Odyssey
    invariably turn to her for help. However, she is extremely anxious and will not jump into water until she has made absolutely
    sure all of her equipment is in order.
