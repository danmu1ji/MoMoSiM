  nameEn: Shimiko
  summaryEn: Shimiko is the librarian of Trinity Integrated Academy's Library Committee. An absolute bookworm, she is one
    of the few students who has read the huge book collection in Trinity Library. She also loves to recommend books to others
    as much as she loves reading them, such that the first thing that comes to her mind when meeting someone new is "What
    book would suit this person's taste?"
