  nameEn: Nonomi
  summaryEn: A member of the Countermeasure Council of Abydos. She has an emotional and gentle personality, and plays a role
    as a mental support bringing together the members of the Countermeasure Council, which has many extreme personalities.
    Though she doesn't say it herself, she is the daughter of a very rich family. In fact, she pays for almost all of the
    Countermeasure Council's snacks from her own allowance.
