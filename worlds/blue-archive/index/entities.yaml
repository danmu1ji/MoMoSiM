  nameEn: Arisu
  summaryEn: Student of Millennium and member of the Game development club. She was found sleeping inside some ruins. Everything
    about her is unknown, including her age. Currently, she enjoys playing videogames with Momoi, Midori and Yuzu and has
    become a serious game maniac. Because she picks up lines from retro games, her speech tends to be hesitant and unnatural.
