  nameEn: Hasumi
  summaryEn: Enrolled at Trinity Integrated Academy, Hasumi is the Justice Actualization Committee's No. 2. In place of its
    president, Tsurugi, who embodies wildness, Hasumi also acts as the Justice Actualization Committee's tactical commander.
    At a glance she appears composed and intellectual, like the archetypal Trinity student. However, Hasumi too is a fully-fledged
    member of the Justice Actualization Committee, and will sometimes act recklessly while retaining her composed nature.
