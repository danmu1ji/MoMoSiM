  nameEn: Nagusa
  summaryEn: A student of the Hyakkiyako Academy and a member of the Hyakkaryouran Conflict Resolution Council. Originally
    the vice president of Hyakkaryouran, Nagusa inherited the leadership position after the previous president, Ayame, disappeared.
    Nagusa is timid, has low self-esteem, and is indecisive, but she has shown the strength of character to overcome fears
    and move forward for the sake of those she cares about.
