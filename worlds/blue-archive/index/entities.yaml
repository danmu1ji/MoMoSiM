  nameEn: Reijo
  summaryEn: A member of Shanhaijing Senior High School, Reijo is the manager of the main branch of the Genbu Trading Company,
    Rumi's assistant, and a security guard. She is quite a kung fu fanatic, and often tries to imitate phrases and actions
    of a certain famous martial artist. Contrary to her cool and detached appearance, she sometimes shows a fiery passion.
