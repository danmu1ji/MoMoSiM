- id: category:trinity-make-up-work-club
  type: category
  name: 보충수업부
  summary: 블루 아카이브 트리니티 종합학원 소속 동아리로, 성적 부진·품행 문제를 이유로 기존 부에서 퇴부된 학생들을 편입시켜 계도한다는 명목 아래 실제로는 나기사의 '트리니티 내부 배신자 색출'을 위해 만든
    동아리이며, 부장은 아지타니 히후미이고 메인스토리 3편 1~3장의 주역이다.
