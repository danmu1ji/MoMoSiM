  nameEn: Niko
  summaryEn: Deputy leader of the FOX Squad from SRT Special Academy, callsign "FOX2". Niko has a kind and gentle personality
    and easily gets along with anyone. Because of this, many juniors at SRT Academy rely on her, even beyond her own squad.
    She is skilled at infiltration and camouflage and also manages the squad's operations. Niko's specialty is making inarizushi.
    She often prepares it as lunch for her squadmates, and the excellent taste has earned it a strong reputation throughout
    SRT Academy.
