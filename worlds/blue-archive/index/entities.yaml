  nameEn: Ibuki
  summaryEn: A student from Gehenna Academy, member of the Pandemonium Society, and a mascot-like girl. She was originally
    a student of Gehenna Academy's elementary school, but Ibuki's ability was recognized and she joined Gehenna's "Pandemonium
    Society", which only the best students can enter. Being the youngest member of the Pandemonium Society, she is loved by
    everyone for her earnest cuteness. She is a well-behaved girl who works diligently so as not to cause trouble for her
    seniors.
