  nameEn: Noa
  summaryEn: Member of the Millennium Science School, secretary of the "Seminar" student council. Noa mainly records seminar
    decisions and meeting minutes, and is also in charge of the patent attorney's duties of identifying and registering patents
    for products developed by Millennium students. She has a very good memory and can almost perfectly memorize whatever she
    sees and hears once.
