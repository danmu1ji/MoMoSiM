  nameEn: Mutsuki
  summaryEn: A student of Gehenna Academy, Mutsuki is the go-getter of Problem Solver 68. Contrary to her guilt-ridden childhood
    friend Aru, Mutsuki is the kind who loves causing crime and trouble without a worry. No one can read Aru better than Mutsuki,
    even if she doesn't give any particular thought to the matter.
