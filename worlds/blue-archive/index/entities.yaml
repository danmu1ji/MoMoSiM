  nameEn: Momiji
  summaryEn: Momiji is the bookworm girl from Red Winter Federal Academy, and a member of the "Knowledge Liberation Front".
    Unlike other Red Winter students who fight for bread and snacks, her struggle lies in adding more books to the library.
    Momiji's quite the otaku, so the book purchase requests she regularly files are clearly driven by personal interests.
    As a result, most of her requests so far have been rejected, but Momiji continues to submit them without giving up.
