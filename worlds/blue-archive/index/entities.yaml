  nameEn: Hoshino
  summaryEn: A young, lazy girl from Abydos High School. She's currently the vice president of the Abydos Student Council,
    and is also the president of the Countermeasure Council. Speaking like an old man, she enjoys playing around more than
    work. Because of this, she's often the subject of anger from the rest of the council, but once the mission starts she
    protects the other members by fighting valiantly on the front lines.
