  nameEn: Rumi
  summaryEn: Rumi is a member of Shanhaijing Senior High School and the chairman of the gourmet Black Tortoise Promenade.
    Under her extraordinary management, Black Tortoise Promenade grew from a mediocre shopping street into one of the best
    gourmet districts in Kivotos. Although she is at odds with the Shanhaijing student council, who are wary of her growing
    influence, Rumi herself seems to have no interest in anything other than developing the enterprise.
