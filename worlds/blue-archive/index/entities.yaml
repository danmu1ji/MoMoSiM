  nameEn: Hanae
  summaryEn: Newly enrolled at Trinity Integrated Academy, Hanae is a lively and cheerful girl who belongs to the Rescue Knights.
    She has a positive attitude towards everything and is full of energy, but has a tendency to become overexcited when she
    finds a patient, usually making the situation worse. Despite being quite an eccentric character, strangely enough, patients
    who have received her care have all recovered right away no matter their illness.
