  nameEn: Himari
  summaryEn: Enrolled at Millennium Science School, the former director of the hacker group "Veritas" and the current director
    of the Supernatural Phenomenon Task Force. A self-proclaimed super genius and sickly beautiful girl hacker, who is said
    to be an owner of the "Omniscience" degree, something only three people in the history of Millennium could claim. ...it's
    not entirely clear if that is true or whether such degree even exists. According to Himari, a girl with many secrets is
    alluring... She is also a leading genius hacker, and at the same time, has a penchant for all things occult.
