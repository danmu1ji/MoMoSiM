  nameEn: Akari
  summaryEn: Enrolled in Gehenna Academy, Akari is a member of the Gourmet Research Society. People may think she is just
    a quiet young girl, but she is actually the long-reigning champion food fighter of the Kivotos Eating Tournament. While
    fundamentally a calm and good-natured girl, like a true Gehenna student she is occasionally willing to cause great trouble
    for others.
