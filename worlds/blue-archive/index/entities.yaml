  nameEn: Renge
  summaryEn: Renge is a member of the Hyakkiyako Academy and the captain of the Hyakkaryouran Dispute Mediation Committee's
    Assault Squad. She has a strong sense of justice and is very compassionate. While Renge cares deeply for her juniors,
    she is also known by them to be a very strict and uncompromising instructor. She has no regrets about joining Hyakkaryouran,
    but Renge is concerned that she is missing out on enjoying her youth to its fullest. Perhaps as a reaction to this, she
    is pursuing the kind of adolescence that is depicted in manga and novels, pushing forward with her training, filled with
    excitement at the prospect of meeting her destiny.
