  nameEn: Chinatsu
  summaryEn: Enrolled at Gehenna Academy, Chinatsu is in charge of first aid at the Public Morals Committee. Committed to
    observing the rules and the proper procedures, Chinatsu is one of the few sensible members of the Public Morals Committee,
    and it falls on her to keep Ako and Iori in check when they get out of control. Her formal way of speaking tends to give
    the impression of being cold and distant, "typical of a member of the Public Morals Committee". However, she's really
    a kind girl who completely softens up when in front of cute animals.
