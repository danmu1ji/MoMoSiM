  nameEn: Serika
  summaryEn: A student of Abydos High School, and the grouchy secretary of the Abydos Countermeasure Committee. One with many
    complaints, Serika is the type hesitant to show her emotions. Despite her daily habit of saying "It's fine if this school
    goes bankrupt", she has a deep love for her school and works tirelessly behind the backs of her clubmates to pay off her
    school's debt.
