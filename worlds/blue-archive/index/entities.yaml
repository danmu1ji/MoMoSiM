- id: category:trinity-after-school-sweets-club
  type: category
  name: 방과후 디저트부
  summary: 블루 아카이브의 트리니티 종합학원 소속 공식 동아리. 쉬는 날 단것을 찾아다니는 지극히 친목 목적의 먹방 투어 모임이지만 엄연히 로고와 부실을 갖춘 정식 동아리이며, 트리니티 정치와는 무관한 평범한
    학생들의 시선을 대변하는 포지션이다. 그런데도 멤버들은 의외로 상당한 싸움꾼들이고, 단것이 걸리면 걷잡을 수 없이 흉포해진다.
  markdown: lore/trinity-after-school-sweets-club.md
  parent: category:trinity
  tags:
  - club
  relations: []
- id: category:trinity-justice-task-force
  type: category
  name: 정의실현부
  summary: 블루 아카이브 트리니티 종합학원 소속 동아리로, 학원의 자치경찰이자 봉사단체이며 실질적으로는 트리니티의 공식 무력 기관이자 티파티의 산하기관이다.
  markdown: lore/trinity-justice-task-force.md
  parent: category:trinity
  tags:
  - club
  relations: []
- id: category:trinity-library-committee
  type: category
  name: 도서부
  summary: 트리니티 종합학원의 중앙 도서관과 고서관 등 학교 내 도서관들을 관리하는 동아리로, 키보토스 최대 규모의 장서를 지키기 위해 부원들이 규칙 위반자에게 강경하게 나서는 조직이다.
  markdown: lore/trinity-library-committee.md
