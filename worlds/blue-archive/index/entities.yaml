  nameEn: Kotone
  summaryEn: Vice-captain of the Diving Club at Odyssey Maritime School. Kotone has poor eyesight and usually wears strong
    prescription glasses. While her vision is subpar, her hearing and intuition are exceptional. When visibility is poor underwater,
    she relies on sounds to lead the club members. Kotone picked up a hobby of communicating via ham radio, which led to her
    developing connections with students on the land.
