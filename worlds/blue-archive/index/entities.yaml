  nameEn: Junko
  summaryEn: A prim yet gluttonous member of Gehenna Academy's Cuisine Research Society. Differing from her other club members
    who often overeat everyday food, Junko is one to take part in a certain extent of enjoying reasonable quality cuisine.
    However she is known to lose her sense of reason when delicious foods are placed in front of her.
