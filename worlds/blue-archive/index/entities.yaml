  nameEn: Saki
  summaryEn: Saki is the point man of the RABBIT platoon, belonging to SRT Special Academy. She entered the SRT Special Academy
    in search of a life based on strict rules and regulations, but the academy was suddenly shut down. Saki now lives in a
    park with other members of the same platoon, always carrying around an SRT tactics manual, and is basically the type of
    person who always focuses on following the principles of the school. She enjoys foraging for wild vegetables and other
    scavenged items, which seems to be of great use in the current scarcity of resources in the park. Her callsign is "RABBIT2".
