  nameEn: Haruna
  summaryEn: Enrolled at Gehenna Academy, Haruna is the club president of the Gourmet Research Society. Upon first look at
    her, one might think she is a rich princess-like and aloof elegance, but get her involved in talks of food and all sense
    of distinction is lost in this zealous gourmet. In contrast to such gluttony, she is actually not one with much of an
    appetite. Favorite foods are greasy, full of hormones, and stew-centric.
