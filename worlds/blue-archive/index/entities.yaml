  nameEn: Wakamo
  summaryEn: Formerly from Hyakkiyako Alliance Academy, Wakamo is one of the "Seven Prisoners" that escaped from Corrections
    Bureau after being suspended from school. Known as the Fox of Calamity for her indiscriminate and large-scale destruction,
    she is widely feared. Her motives and purpose are shrouded in mystery. Her true face, hidden beneath the mask, is rumored
    to be as scary as a demon or as ugly as the devil.
