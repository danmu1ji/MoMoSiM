  nameEn: Konoka
  summaryEn: A student from Valkyrie Police Academy and the Deputy Director of the Public Peace Bureau. ​Though her appearance
    sometimes leads people to mistake her for a suspect, she is a highly capable officer. She can trace the psychology and
    behavior of criminals better than anyone else in the Bureau, though she doesn't seem to be doing it consciously. ​Rumor
    has it that she is the student who has been promoted the most—and demoted the most—in the history of the Public Peace
    Bureau.
