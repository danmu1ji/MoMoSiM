  nameEn: Niya
  summaryEn: President of Yin-Yang Club at the Hyakkiyako Academy. Outsiders may know Niya as the Student Council President,
    but she is better known as the Non-Working President as due to the structure of Hyakkiyako Academy she is usually tied
    in much more complicated matters… or so she claims; the dislike of work is her second nature. Niya always seems to casually
    cause havoc, but behind it all, there may be an ulterior motive that she does not reveal to others.
