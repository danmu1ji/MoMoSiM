  summaryEn: Miyako is the leader of RABBIT platoon belonging to SRT Special Academy. She enrolled in the SRT Special Academy
    admiring the success of her seniors, only to find her school suddenly closed. She is now living in the park with fellow
    platoon members. Her facial expressions do not change much and she rarely shows her emotions, so people around Miyako
    tend to think that she is unsociable. However, deep down inside, she is always concerned about the members of her platoon
    and has a kind heart. Her callsign is "RABBIT1".
