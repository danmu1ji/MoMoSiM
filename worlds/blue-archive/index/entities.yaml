  nameEn: Mine
  summaryEn: Member of Trinity Integrated Academy, Captain of the Rescue Knights. Mine is a white-clad warrior with strong
    will and bold personality, although she also has a radical side. Common wisdom about Rescue Knights across Trinity is
    "Mine breaks it and the Knights heal". Despite this, Mine is known to spend her free time diligently maintaining her own
    equipment and inviting acquaintances to tea parties. Her deep appreciation and knowledge of teas is on par with Hasumi
    from the Justice Actualization Committee.
