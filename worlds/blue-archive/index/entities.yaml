  nameEn: Yuuka
  summaryEn: Enrolled in the Millennium Science School, Yuuka is the treasurer of the student council known as "Seminar".
    A prominent mathematical genius even amongst Millennium's STEM-rich student base, she supervises the management of the
    school's budget. Yuuka's specialty is the abacus, and she has a habit of counting on one in order to compose herself when
    faced with complex and troubling matters.
