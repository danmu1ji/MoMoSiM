  nameEn: Kotama
  summaryEn: A hacker from the hacker group Veritas of Millennium Science School. Her specialty is eavesdropping. She is a
    strange girl who likes to eavesdrop on people's secret conversations. She's not good at talking to people, to such a degree
    that she even uses honorifics with younger first graders. In real life she's a shy girl of few words, but on the internet
    she's quite the talker.
