  nameEn: Fuuka
  summaryEn: Belonging to Gehenna Academy's School Lunch Club, Fuuka is in charge of managing the school's cafeteria. Working
    hard every morning to make a huge number of meals for everyone in the school, her kindness and diligence make her a rarity
    amongst Gehenna students. While her meals are certainly good, due to the school cafeteria being understaffed, her true
    culinary skills tend to go undervalued. Nevertheless, she puts in effort day by day to provide tastier meals to everyone.
