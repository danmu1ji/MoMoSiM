  nameEn: Kasumi
  summaryEn: A student of Gehenna Academy, and manager of its Hot Springs Development Department. Kasumi insists that any
    land with a natural spring must be developed into a hot spring, and once a suitable location has been found she will do
    whatever it takes to blast through the ground with complete disregard for the surroundings. Although she enjoys full support
    from fellow club members, her language and actions are those of a wanted criminal.
