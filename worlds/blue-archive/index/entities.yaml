  nameEn: Shigure
  summaryEn: A student of the Red Winter Federation Academy, she is presently assigned to the Special Class No. 227 in the
    old school building after being suspended. The reason for the suspension was an act of secretly mixing alcohol into kompot
    ration. She is a childhood friend of Nodoka, who is also in the Special Class No. 227, and rumor has it that Shigure deliberately
    caused the accident after Nodoka was sent to special class as a result of disciplinary action. Regardless of the truth
    of the matter, she loves her homemade kompot, and always carries it in her pocket flask.
