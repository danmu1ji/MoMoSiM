  nameEn: Hare
  summaryEn: A member of hacker group Veritas of Millennium. Among the many geniuses of Millenium, she is one of the most
    prominent. Most of the advanced cutting-edge devices in Millennium were created by her. However, despite her ability and
    achievements, she isn't one to brag. She is kind, friendly with other students and a good listener.
