- id: category:trinity-tea-party
  type: category
  name: 티파티
  summary: 트리니티 종합학원의 학생회로, 파테르·필리우스·상투스 세 분파의 수장이기도 한 학생회장 3인이 이끄는 비밀주의 사교계 성격의 삼두정치 집단. 일반 학생들과 분리된 생활을 하며 정의실현부·구호기사단 등
