  nameEn: Shun
  summaryEn: Belonging to Shanhaijing Senior High School, Shun is an instructor of the disciplinary support department known
    as "Meihua Yuan" (Plum Blossom Garden). The club also shares its name with an actual garden. Shun's kind and tolerant
    nature has earned her the trust of not only the children of Meihua Yuan, but also other students of Shanhaijing. Having
    been an instructor for a long time, she rarely gets angry at the children's mischief, but she is sensitive when one of
    them brings up her age.
