  nameEn: Umika
  summaryEn: A first-year member of the festival management committee of Hyakkiyako Alliance Academy. Being from the countryside,
    Umika was always fascinated by the festivals held in cities. She has exhaustive knowledge of all the festivals held throughout
    Kivotos. Once Umika starts talking, she tends to gush about obscure festival topics; others often note that she's very
    attractive when silent.
