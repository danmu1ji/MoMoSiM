  nameEn: Kaede
  summaryEn: A student of Hyakkiyako Alliance Academy, an energetic member of the discipline club. Originally, she was a mischievous
    child from a rural Hyakkiyako countryside, but the moment she met Tsubaki and Mimori, Kaede decided to join the discipline
    club saying "I want to be such a wonderful lady!". She is studying every day to get closer to her ideals, but most of
    the training leads to trouble for some reason.
