  name: 시스터후드
  summary: 트리니티 종합학원의 대성당을 본부로 삼아 학원 내 여러 성당과 유적을 관리하는 트리니티의 파벌이자 수녀(실제로는 수도사제) 집단으로, 개인 학생이 아니라 단체다.
