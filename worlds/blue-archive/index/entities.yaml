  nameEn: Izuna
  summaryEn: A member of Ninjutsu Research Club of Hyakkiyako. Her dream is "to become the greatest Ninja of Kivotos". Because
    of pursuing a dream not many people can reason with, Izuna is often seen alone despite her bright and cheerful personality.
    In her pursuit to become a proper ninja, she continues to refer to Sensei as "Lord" while "escorting" him (simply tailing
    Sensei around Kivotos) and devoting herself to various other activities.
