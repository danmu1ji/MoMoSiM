  nameEn: Mimori
  summaryEn: Member of the Hyakkiyako Alliance Academy, and a kind vice-president of the discipline club. Mimori always has
    a cheerful smile and a gentle demeanor, and she is very popular with everyone. Having been shojo manga fan since young
    age, she pursues a dream of embodying the "Yamato Nadeshiko" character, to which end she joined the discipline club. Together
    with her childhood friend and club director Tsubaki she is working hard every day to practice cooking and cleaning.
