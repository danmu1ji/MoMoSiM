  nameEn: Otogi
  summaryEn: The sniper of SRT Special Academy's FOX Squad, callsign "FOX4". Among snipers, who are often lone wolves, Otogi
    is a rare type who can quickly get along even with people she has just met. Within the squad, she plays the role of a
    mood-maker, and on the battlefield, she serves to put pressure on the enemy morale. Otogi is skilled at handling electronic
    equipment, and can even handle repairs for most mechanical equipment malfunctions.
