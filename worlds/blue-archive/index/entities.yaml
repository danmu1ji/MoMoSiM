    label: 정보의 통제를 중시하는 리오와 정면으로 충돌하는, 정보의 자유를 중시하는 사상을 가지고 있기에 대립하는 관계. 다만 완전히 담을 쌓은 것은 아니며 필요하다면 얼마든지 협력하고 있다. 텐도 아리스가 발견되자
