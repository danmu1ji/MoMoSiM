  nameEn: Momoi
  summaryEn: Student of Millennium Science School, and the scenario writer for the Game Development Club. As per the title,
    Momoi works along with her twin sister Midori in game development. Momoi being the cheerful one with her sister oppositely
    shy, they don't have much chemistry, but they have unrivalled passion in working together when it comes to games. As of
    now they've managed to become very close.
