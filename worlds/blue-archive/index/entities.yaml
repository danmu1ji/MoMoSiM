  nameEn: Yukari
  summaryEn: A first-year member of the Hyakkiyako Alliance Academy and the Hyakkaryouran Dispute Mediation Committee. Yukari
    is the heiress of the venerable Kadenokouji family. However, rather than inheriting the family business, she decided to
    pursue her dream of joining Hyakkaryoran. She takes pride in being a member of Hyakkaryouran and has a lot of energy.
    Although she sometimes falters, she has the strength of character to recover quickly. She respects her seniors, and especially
    admires Nagusa among them.
